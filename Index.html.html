<button class="hot" aria-label="Home" style="left:0;top:85%;width:20%;height:15%" onclick="window.scrollTo({top:0,behavior:'smooth'})"></button><button class="hot" aria-label="My Reptiles" style="left:20%;top:85%;width:20%;height:15%" onclick="openPanel('My Reptiles')"></button><button class="hot" aria-label="Calendar" style="left:40%;top:85%;width:20%;height:15%" onclick="openPanel('Calendar')"></button><button class="hot" aria-label="Care Logs" style="left:60%;top:85%;width:20%;height:15%" onclick="openPanel('Care Logs')"></button><button class="hot" aria-label="Resources" style="left:80%;top:85%;width:20%;height:15%" onclick="openPanel('Resources')"></button></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closePanel()"><div class="modal"><button class="close" aria-label="Close" onclick="closePanel()">×</button><h2 id="heading"></h2><div id="content"></div></div></div><script>
let entries=[];try{entries=JSON.parse(localStorage.getItem('scaleTellApprovedPreview')||'[]')}catch(e){}let current='';const animals=['Oro','Kane','Roux'];function closePanel(){document.getElementById('sheet').classList.remove('on')}function openPanel(name){current=name;document.getElementById('heading').textContent=name;document.getElementById('sheet').classList.add('on');render()}function render(){let el=document.getElementById('content');if(animals.includes(current)){el.innerHTML='<p>'+current+' · '+(current==='Roux'?'Corn Snake':'Ball Python')+'</p><p>Choose a care activity to record for '+current+'.</p>'+['Feeding Tracker','Enclosure Care','Shed History'].map(x=>'<button class="action" onclick="openPanel(\''+x+'\')">'+x+'</button> ').join('');return}if(current==='My Reptiles'){el.innerHTML=animals.map(x=>'<button class="action" onclick="openPanel(\''+x+'\')">'+x+'</button> ').join('');return}if(['Feeding Tracker','Enclosure Care','Shed History','Calendar'].includes(current)){el.innerHTML='<div class="notice">Preview-only records. This does not change your published app or send notifications.</div><label>Reptile<select id="animal">'+animals.map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Date<input type="date" id="date"></label><label>Entry<select id="detail">'+(current==='Feeding Tracker'?['Ate','Refused','Offered']:current==='Enclosure Care'?['Spot clean','Water change','Substrate change','Temperature / humidity check']:current==='Shed History'?['Complete shed','Incomplete shed','In blue']:['Feeding reminder','Enclosure reminder','Weight check']).map(x=>'<option>'+x+'</option>').join('')+'</select></label><button class="action" onclick="saveEntry()">Save entry</button>'+list();document.getElementById('date').value=new Date().toLocaleDateString('en-CA');return}if(current==='Care Logs'){el.innerHTML=list(true);return}el.innerHTML='<p>This section is a design placeholder for a later version. The approved dashboard artwork is preserved exactly.</p>'}function list(all=false){let selected=all?entries:entries.filter(x=>x.section===current);return '<h3>Saved preview entries</h3>'+(selected.length?selected.slice().reverse().map(x=>'<div class="entry"><b>'+x.animal+'</b> · '+x.detail+'<br><span class="muted">'+x.date+' · '+x.section+'</span></div>').join(''):'<p class="muted">No entries yet.</p>')}function saveEntry(){let date=document.getElementById('date').value;if(!date){alert('Choose a date first');return}entries.push({section:current,animal:document.getElementById('animal').value,detail:document.getElementById('detail').value,date});try{localStorage.setItem('scaleTellApprovedPreview',JSON.stringify(entries))}catch(e){}render()}</script></body></html>
