<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scale & Tell | Keeper Beta</title><meta name="theme-color" content="#45205b"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Scale & Tell"><meta name="application-name" content="Scale & Tell"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="stylesheet" href="styles.css?v=3.22"></head><body class="authLocked"><section id="authGate" role="region" aria-label="Scale and Tell account access">

<div class="sheet" id="sheet" onclick="if(event.target===this)closePanel()"><div class="modal"><button class="close" aria-label="Close" onclick="closePanel()">×</button><button class="panelBackButton" id="panelBackButton" type="button" aria-label="Go back to previous screen" onclick="panelBack()" hidden>← Back</button><h2 id="heading"></h2><div id="content"></div></div></div><div class="guideZoom" id="guideZoom" role="dialog" aria-modal="true" aria-label="Enlarged care guide page" hidden>

 <div class="guideZoomStage" id="guideZoomStage" ontouchstart="zoomTouchStart(event)" ontouchmove="zoomTouchMove(event)" ontouchend="zoomTouchEnd(event)"><img id="guideZoomImage" draggable="false" alt="Enlarged Herps and Hers care guide page"></div>

</div>
