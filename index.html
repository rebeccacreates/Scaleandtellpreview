function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function today(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function save(){localStorage.setItem('scaleTellApprovedPreview',JSON.stringify(entries))}
function updateStats(){let t=today(), reminders=entries.filter(e=>e.section==='Calendar'&&!e.done);document.getElementById('statReptiles').textContent=animals.length;document.getElementById('statDue').textContent=reminders.filter(e=>e.date<=t).length;document.getElementById('statUpcoming').textContent=reminders.filter(e=>e.date>t).length;document.getElementById('statLogs').textContent=entries.filter(e=>e.section!=='Calendar').length}
function closePanel(){document.getElementById('sheet').classList.remove('on')}
function openPanel(name,animal){if(animal)selectedAnimal=animal;else if(animals.includes(name))selectedAnimal=name;current=name;document.getElementById('heading').textContent=name;document.getElementById('sheet').classList.add('on');render()}
function niceDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return esc(v||'');let [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function toggleReminderForm(){let f=document.getElementById('reminderForm'),b=document.getElementById('addReminderButton');if(!f)return;f.hidden=!f.hidden;b.textContent=f.hidden?'+ Add Reminder':'− Hide Reminder Form'}
function recordMeta(e){return [e.preyType,e.preyWeight?e.preyWeight+' g':'',e.response,e.notes].filter(Boolean).map(esc).join(' · ')}
function logList(items){return items.length?items.slice().reverse().map(e=>'<div class="entry"><b>'+esc(e.animal)+'</b> · '+esc(e.detail)+'<br><span class="muted">'+niceDate(e.date)+' · '+esc(e.section)+(recordMeta(e)?' · '+recordMeta(e):'')+'</span></div>').join(''):'<p class="muted">No records yet ♡</p>'}
function render(){updateStats();let el=document.getElementById('content');
if(animals.includes(current)){let a=current,p=profiles[a]||{},history=entries.filter(e=>e.animal===a&&e.section!=='Calendar'),feeding=history.filter(e=>e.section==='Feeding Tracker'),shed=history.filter(e=>e.section==='Shed History'),weights=entries.filter(e=>e.animal===a&&e.section==='Weight Tracker'),rem=entries.filter(e=>e.animal===a&&e.section==='Calendar'&&!e.done),last=feeding.filter(e=>e.detail==='Ate').sort((x,y)=>y.date.localeCompare(x.date))[0];el.innerHTML='<div class="profileHero"><h3>'+esc(a)+' ♡</h3><p>'+species[a]+'</p><p class="muted">'+esc(p.notes||'Your individual reptile profile')+'</p></div><div class="profileGrid"><div><small>Last feeding</small><b>'+(last?niceDate(last.date):'Not recorded')+'</b></div><div><small>Care entries</small><b>'+history.length+'</b></div><div><small>Latest weight</small><b>'+esc(weights.slice().sort((x,y)=>y.date.localeCompare(x.date))[0]?.detail||p.weight||'Not set')+'</b></div><div><small>Enclosure</small><b>'+esc(p.enclosure||'Not set')+'</b></div></div><button class="action secondary" onclick="editProfile(\''+a+'\')">Edit profile</button><div class="tabs"><button onclick="profileTab(\'Overview\')">Overview</button><button onclick="profileTab(\'Feeding\')">Feeding</button><button onclick="profileTab(\'Weights\')">Weights</button><button onclick="profileTab(\'Sheds\')">Sheds</button><button onclick="profileTab(\'Care\')">Care</button></div><div id="profileTab"></div><h3 class="sectionTitle">Upcoming care</h3>'+(rem.length?rem.slice().sort((x,y)=>x.date.localeCompare(y.date)).slice(0,3).map(e=>'<div class="timeline"><b>'+esc(e.detail)+'</b> · '+niceDate(e.date)+' <button class="smallbutton" onclick="completeReminder('+entries.indexOf(e)+')">Mark done</button></div>').join(''):'<p class="muted">No upcoming reminders.</p>')+'<button class="action" onclick="openPanel(\'Calendar\',\''+a+'\')">View full calendar / Add reminder</button>';profileTab('Overview');return}
if(current==='Upcoming Care'||current==='Due Today'){let t=today(),pending=entries.filter(e=>e.section==='Calendar'&&!e.done&&(current==='Due Today'?e.date<=t:e.date>t)).sort((a,b)=>a.date.localeCompare(b.date));el.innerHTML='<p class="muted">'+(current==='Due Today'?'Unfinished tasks due today or earlier.':'Your next three scheduled tasks.')+'</p>'+taskMarkup(pending.slice(0,3))+'<button class="action" onclick="openPanel(\'Calendar\')">View full calendar</button>';return}
if(current==='Edit Profile'){let p=profiles[selectedAnimal]||{};el.innerHTML='<p>'+selectedAnimal+' · '+species[selectedAnimal]+'</p><label>Weight (include unit)<input id="weight" maxlength="30" placeholder="e.g. 200 g" value="'+esc(p.weight||'')+'"></label><label>Enclosure<input id="enclosure" maxlength="70" placeholder="e.g. 4 × 2 × 18" value="'+esc(p.enclosure||'')+'"></label><label>Notes<textarea id="profileNotes" maxlength="400" placeholder="Anything you want to remember">'+esc(p.notes||'')+'</textarea></label><button class="action" onclick="saveProfile()">Save profile</button><button class="action secondary" onclick="openPanel(\''+selectedAnimal+'\')">Cancel</button>';return}
if(current==='My Reptiles'){el.innerHTML='<p>Choose a reptile to open their profile.</p>'+animals.map(a=>'<button class="action" onclick="openPanel(\''+a+'\')">'+a+' · '+species[a]+'</button>').join('');return}
if(['Feeding Tracker','Enclosure Care','Shed History','Calendar'].includes(current)){let options=current==='Feeding Tracker'?['Ate','Refused','Offered']:current==='Enclosure Care'?['Spot clean','Water change','Substrate change','Temperature / humidity check','Enclosure refresh']:current==='Shed History'?['Complete shed','Incomplete shed','In blue']:['Feeding reminder','Enclosure reminder','Weight check','Shed check','Other care'];el.innerHTML=(current==='Calendar'?'<p class="muted">See your full schedule below. Add reminders only when needed.</p><div id="calendarList">'+calendarMarkup()+'</div><button class="action" id="addReminderButton" onclick="toggleReminderForm()">+ Add Reminder</button><div id="reminderForm" hidden>':'')+'<div class="notice">Preview data is stored in this browser only. No phone alerts or shared accounts yet.</div><label>Reptile<select id="animal">'+animals.map(a=>'<option '+(a===selectedAnimal?'selected':'')+'>'+a+'</option>').join('')+'</select></label><label>Date<input type="date" id="date"></label><label>Entry<select id="detail">'+options.map(x=>'<option>'+x+'</option>').join('')+'</select></label>'+(current==='Feeding Tracker'?'<label>Prey type<input id="preyType" maxlength="60" placeholder="e.g. rat fuzzy"></label><label>Prey weight (grams)<input id="preyWeight" type="number" min="0" max="10000" step="0.1" placeholder="e.g. 16"></label><label>Feeding response<select id="feedingResponse"><option value="">Select response (optional)</option><option>Immediate strike</option><option>Delayed strike</option><option>Tong-fed</option><option>Left overnight</option><option>Refused</option><option>Other</option></select></label>':'')+'<label>Optional notes<textarea id="entryNotes" maxlength="300" placeholder="Observations..."></textarea></label><button class="action" onclick="saveEntry()">Save entry</button>'+(current==='Calendar'?'</div>':'<h3>Saved preview entries</h3>'+logList(entries.filter(e=>e.section===current)));document.getElementById('date').value=today();return}
if(current==='Weight Tracker'){el.innerHTML='<div class="notice">Record a weight for '+esc(selectedAnimal)+'. Enter grams only.</div><label>Date<input type="date" id="date"></label><label>Weight (g)<input type="number" min="0.1" max="100000" step="0.1" id="weightValue" placeholder="e.g. 200"></label><button class="action" onclick="saveWeight()">Save weight</button><h3>Weight history</h3>'+logList(entries.filter(e=>e.section==='Weight Tracker'&&e.animal===selectedAnimal));document.getElementById('date').value=today();return}
if(current==='Care Logs'){el.innerHTML='<p class="muted">One shared history. Filter by reptile or care type.</p><div class="filters"><label>Reptile<select id="logAnimal" onchange="filterLogs()"><option value="">All reptiles</option>'+animals.map(a=>'<option>'+a+'</option>').join('')+'</select></label><label>Activity<select id="logType" onchange="filterLogs()"><option value="">All care</option>'+['Feeding Tracker','Enclosure Care','Shed History','Weight Tracker'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>From date<input type="date" id="logFrom" onchange="filterLogs()"></label><label>To date<input type="date" id="logTo" onchange="filterLogs()"></label></div><div id="filteredLogs"></div><button class="action secondary" onclick="openPanel(&quot;Data &amp; Backup&quot;)">Export / import backup</button>';filterLogs();return}
if(current==='Data & Backup'){el.innerHTML='<p class="muted">Back up all three reptile profiles and your care history as a JSON file. This preview is browser-local, not a synced account.</p><button class="action" onclick="exportBackup()">Download backup</button><label>Restore backup<input type="file" id="backupFile" accept=".json,application/json"></label><button class="action secondary" onclick="importBackup()">Restore selected backup</button><p class="notice">Restoring replaces the records currently in this browser. Export your current records first.</p>';return}
if(current==='Photo Journal'){el.innerHTML='<p>Photo uploads are not yet enabled in this preview. Your approved reptile portraits remain on the dashboard.</p>';return}
el.innerHTML='<p>This section is coming in a future build. The approved dashboard design remains unchanged.</p>'}
function taskMarkup(tasks){return tasks.length?tasks.map(e=>{let i=entries.indexOf(e);return '<div class="task"><b>'+esc(e.animal)+'</b> · '+esc(e.detail)+'<small>'+niceDate(e.date)+(e.notes?' · '+esc(e.notes):'')+'</small><button onclick="openPanel(\''+e.animal+'\')">View profile</button>'+(e.done?'<small class="completedLabel">✓ Completed</small>':'<button onclick="completeReminder('+i+')">Mark Done</button><button onclick="editReminder('+i+')">Edit</button><button onclick="deleteReminder('+i+')">Delete</button>')+'</div>'}).join(''):'<p class="muted">No tasks here ♡</p>'}
function editReminder(i){let e=entries[i];if(!e||e.section!=='Calendar')return;let d=prompt('Reminder date (YYYY-MM-DD)',e.date);if(d===null)return;if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(d)||Number.isNaN(new Date(d+'T12:00:00').getTime())){alert('Enter a valid date in YYYY-MM-DD format.');return}let type=prompt('Reminder type',e.detail);if(type===null)return;type=type.trim();if(!type)return;let notes=prompt('Notes (optional)',e.notes||'');if(notes===null)return;if(entries.some((x,j)=>j!==i&&x.section==='Calendar'&&!x.done&&x.animal===e.animal&&x.date===d&&x.detail===type)){alert('An identical unfinished reminder already exists.');return}Object.assign(e,{date:d,detail:type,notes:notes.slice(0,300)});save();render()}
function deleteReminder(i){if(!entries[i]||entries[i].section!=='Calendar'||!confirm('Delete this reminder? This cannot be undone.'))return;entries.splice(i,1);save();render()}
function calendarMarkup(){let tasks=entries.filter(e=>e.section==='Calendar').sort((a,b)=>a.date.localeCompare(b.date));return '<h3 class="sectionTitle">Pending</h3>'+taskMarkup(tasks.filter(e=>!e.done))+'<h3 class="sectionTitle">Completed Care</h3>'+taskMarkup(tasks.filter(e=>e.done))}
function filterLogs(){let a=document.getElementById('logAnimal')?.value||'',t=document.getElementById('logType')?.value||'',from=document.getElementById('logFrom')?.value||'',to=document.getElementById('logTo')?.value||'',target=document.getElementById('filteredLogs');if(target)target.innerHTML=logList(entries.filter(e=>e.section!=='Calendar'&&(!a||e.animal===a)&&(!t||e.section===t)&&(!from||e.date>=from)&&(!to||e.date<=to)))}
function growthChart(a){let w=entries.filter(e=>e.animal===a&&e.section==='Weight Tracker').map(e=>({date:e.date,n:parseFloat(e.detail)})).filter(e=>Number.isFinite(e.n)&&e.n>0).sort((x,y)=>x.date.localeCompare(y.date));if(w.length<2)return '<p class="muted">Log two or more weights to see a growth chart.</p>';let lo=Math.min(...w.map(x=>x.n)),hi=Math.max(...w.map(x=>x.n)),range=hi-lo||1,points=w.map((x,i)=>(20+i*280/(w.length-1))+','+(115-(x.n-lo)/range*90)).join(' ');return '<div class="growth"><strong>Weight trend</strong><svg viewBox="0 0 320 140" role="img" aria-label="Weight history growth chart"><polyline points="'+points+'" fill="none" stroke="#79538e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><small>'+niceDate(w[0].date)+': '+w[0].n+' g → '+niceDate(w[w.length-1].date)+': '+w[w.length-1].n+' g</small></div>'}
function profileTab(tab){let a=current,el=document.getElementById('profileTab');if(!el)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('selected',b.textContent===tab));let types={Feeding:'Feeding Tracker',Weights:'Weight Tracker',Sheds:'Shed History',Care:'Enclosure Care'},selected=tab==='Overview'?entries.filter(e=>e.animal===a&&e.section!=='Calendar'):entries.filter(e=>e.animal===a&&e.section===types[tab]);el.innerHTML='<h3 class="sectionTitle">'+tab+' history</h3>'+(tab==='Weights'?growthChart(a):'')+logList(selected)+'<button class="action" onclick="openPanel(\''+(types[tab]||'Feeding Tracker')+'\',\''+a+'\')">'+(tab==='Overview'?'Log feeding':'Add '+tab.toLowerCase()+' entry')+'</button>'}
function exportBackup(){let data={format:'scale-and-tell-backup',version:1,exportedAt:new Date().toISOString(),entries,profiles};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='scale-and-tell-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(){let f=document.getElementById('backupFile')?.files?.[0];if(!f){alert('Choose a backup file first.');return}if(f.size>3000000){alert('Backup file is too large.');return}let data;try{data=JSON.parse(await f.text())}catch(e){alert('This is not a valid JSON backup.');return}if(data?.format!=='scale-and-tell-backup'||data.version!==1||!Array.isArray(data.entries)||!data.profiles||typeof data.profiles!=='object'||data.entries.length>10000||!data.entries.every(e=>e&&typeof e==='object'&&animals.includes(e.animal)&&typeof e.section==='string'&&typeof e.date==='string'&&typeof e.detail==='string')){alert('This file is not a compatible Scale & Tell backup.');return}if(!confirm('Replace all current records and profiles with this backup? Export your current data first.'))return;entries=data.entries;profiles=data.profiles;save();localStorage.setItem('scaleTellProfiles03',JSON.stringify(profiles));alert('Backup restored.');render()}
function saveWeight(){let date=document.getElementById('date').value,w=Number(document.getElementById('weightValue').value);if(!date||!Number.isFinite(w)||w<=0){alert('Enter a date and a valid weight in grams.');return}entries.push({section:'Weight Tracker',animal:selectedAnimal,detail:w+' g',date,notes:''});save();render()}
function completeReminder(i){if(!entries[i]||entries[i].section!=='Calendar')return;entries[i].done=true;save();render()}
function editProfile(a){selectedAnimal=a;openPanel('Edit Profile')}
function saveProfile(){profiles[selectedAnimal]={weight:document.getElementById('weight').value.trim(),enclosure:document.getElementById('enclosure').value.trim(),notes:document.getElementById('profileNotes').value.trim()};localStorage.setItem('scaleTellProfiles03',JSON.stringify(profiles));openPanel(selectedAnimal)}
function saveEntry(){let date=document.getElementById('date').value;if(!date){alert('Please choose a date.');return}selectedAnimal=document.getElementById('animal').value;let detail=document.getElementById('detail').value,notes=document.getElementById('entryNotes').value.trim();if(current==='Calendar'&&entries.some(e=>e.section==='Calendar'&&!e.done&&e.animal===selectedAnimal&&e.date===date&&e.detail===detail)){alert('This reptile already has an unfinished '+detail.toLowerCase()+' on that date.');return}let preyType=document.getElementById('preyType')?.value.trim()||'',preyWeight=document.getElementById('preyWeight')?.value||'',response=document.getElementById('feedingResponse')?.value||'';if(preyWeight&&(!Number.isFinite(Number(preyWeight))||Number(preyWeight)<0)){alert('Enter a valid prey weight.');return}entries.push({section:current,animal:selectedAnimal,detail,date,notes,...(current==='Feeding Tracker'?{preyType,preyWeight,response}:{})});save();render()}
updateStats();
</script></body></html>
